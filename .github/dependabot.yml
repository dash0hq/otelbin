# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    pull-request-branch-name:
      # Separate sections of the branch name with a hyphen
      # for example, `dependabot-npm_and_yarn-next_js-acorn-6.4.1`
      separator: "-"
  - package-ecosystem: "npm"
    directories:
      - "/packages/otelbin"
      - "/packages/otelbin-validation"
      - "/packages/otelbin-validation-image"
    schedule:
      interval: "monthly"
    # The OpenTelemetry JS packages have to move in lockstep. The stable ones version at 1.x
    # and 2.x while the experimental exporters and instrumentations version at 0.x, and a
    # given experimental release only works against one stable major. Bumping a single
    # package across that boundary is what broke main: @opentelemetry/sdk-trace-node went to
    # 2.x on its own, and 2.x removed TracerProvider.addSpanProcessor out from under
    # packages/otelbin-validation-image/src/lambda-wrapper.ts. Grouping them means such a
    # bump arrives as one pull request that passes or fails as a set, instead of one that
    # looks harmless and is not.
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
    # Tailwind CSS 4 is not a dependency bump, it is a migration: the PostCSS plugin moved to
    # @tailwindcss/postcss, @tailwind directives became @import "tailwindcss", JS config and
    # presets (packages/otelbin/src/design-tokens/tailwind.preset.js) give way to @theme in
    # CSS, tailwindcss-animate is superseded by tw-animate-css, and the v4 defaults silently
    # restyle the app (border color currentColor, 1px rings, renamed utilities such as
    # shadow-sm -> shadow-xs and outline-none -> outline-hidden). A Dependabot pull request
    # for it only ever breaks the build. Drop this entry when someone takes on the migration
    # deliberately, with a visual review of the editor UI.
    ignore:
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"
    pull-request-branch-name:
      # Separate sections of the branch name with a hyphen
      # for example, `dependabot-npm_and_yarn-next_js-acorn-6.4.1`
      separator: "-"
