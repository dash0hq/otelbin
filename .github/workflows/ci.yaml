name: CI

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'
  # Dependabot PRs are excluded from repo secrets under the `pull_request` event, so the
  # credentialed jobs below (prep-itests, run-itests) additionally run under
  # `pull_request_target`, which is only actually used for the `dependabot[bot]` actor (see the
  # `if:` conditions on those jobs). `pull_request_target` runs with the workflow file from
  # `main`, not from the PR branch, so a dependency-bump PR can't rewrite the CI steps it runs
  # under with elevated credentials.
  pull_request_target:
    branches:
      - 'main'

permissions:
  id-token: write
  contents: read

# Ensure we only have one such workflow running per branch, to avoid
# conflicts in the test env. `clean-up-test-env.yaml` uses the same
# group key so a CI deploy and a teardown for the same PR are serialized.
# `github.head_ref` (the PR branch name) is used instead of `github.ref` so that
# `pull_request` and `pull_request_target` runs for the same PR share a group; `pull_request_target`
# reports `github.ref` as the base branch (`refs/heads/main`), which would otherwise put every
# open PR's privileged run into the same group as every other PR and as `push` runs on main.
concurrency:
  group: ${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  otelbin-verify:
    name: OTelBin tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Skip the redundant pull_request_target run for everyone except dependabot: non-dependabot
    # PRs already ran this under the plain pull_request event above.
    if: github.event_name != 'pull_request_target' || github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        shell: bash
        working-directory: packages/otelbin
        run: npm ci

      - name: Lint
        shell: bash
        working-directory: packages/otelbin
        run: npm run lint

      - name: Test
        shell: bash
        working-directory: packages/otelbin
        run: npm run test

  otelbin-validation-image-verify:
    name: OTelBin Validation Image Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # See otelbin-verify above for why this condition exists.
    if: github.event_name != 'pull_request_target' || github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        shell: bash
        working-directory: packages/otelbin-validation-image
        run: npm ci

      - name: Test
        shell: bash
        working-directory: packages/otelbin-validation-image
        run: npm run test

  otelbin-validation-verify:
    name: OTelBin Validation Stack Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # See otelbin-verify above for why this condition exists.
    if: github.event_name != 'pull_request_target' || github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        shell: bash
        working-directory: packages/otelbin-validation
        run: npm ci

      - name: Unit tests
        shell: bash
        working-directory: packages/otelbin-validation
        run: npx jest src/ --no-coverage

      - name: Test CDK stack synthesis
        shell: bash
        working-directory: packages/otelbin-validation
        run: npx jest test/stack.test.ts --no-coverage

  prep-itests:
    name: Deploy validation backend
    needs: ['otelbin-verify', 'otelbin-validation-image-verify', 'otelbin-validation-verify']
    runs-on: 8core_32gb
    timeout-minutes: 30
    # Runs for: pushes to main; PRs from non-dependabot actors (via pull_request, which already
    # has secrets for same-repo branches); and dependabot PRs (via pull_request_target only,
    # since pull_request never carries secrets for the dependabot[bot] actor).
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]')
    outputs:
      test_matrix: ${{ steps.prepare_test_matrix.outputs.test_matrix }}
      validation_api_apigateway_name: ${{ steps.parse_cdk_output.outputs.api_gateway_name }}
      validation_api_apigateway_url: ${{ steps.parse_cdk_output.outputs.api_gateway_url }}\
      test_env_name: ${{ steps.get_test_env_name.outputs.test_env_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For pull_request_target, default checkout is the base branch (main); we need the
          # PR's own head commit, which is what's actually being tested/deployed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install CDK dependencies
        shell: bash
        working-directory: packages/otelbin-validation
        # --ignore-scripts: this job configures AWS credentials in a later step; skipping
        # install-time scripts prevents a compromised/malicious dependency from planting
        # something in this job that later reads those credentials from the shared runner env.
        run: |
          npm ci --ignore-scripts
          npm i -g aws-cli

      - name: Get test environment name
        id: get_test_env_name
        shell: bash
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        # When the trigger is a pull event, use the PR's branch name (`github.head_ref`), which
        # is available only for pull trigger. Otherwise, use the branch on which the commit was pushed.
        # (Ref names in pull requests are in the shape of `<pr_id>/merge` and those will break CDK.)
        # language=bash
        run: |
          echo "test_env_name=$(./.github/workflows/scripts/test_env_name.sh)" >> "$GITHUB_OUTPUT" || exit 1

      - name: Select credentials
        id: select_credentials
        shell: bash
        env:
          TEST_ENVIRONMENT_NAME: ${{ steps.get_test_env_name.outputs.test_env_name }}
          OTELBIN_AUTOMATION_ACCOUNT_PROD: ${{secrets.OTELBIN_AUTOMATION_ACCOUNT_PROD}}
          OTELBIN_AUTOMATION_ACCESS_KEY_ID_PROD: ${{secrets.OTELBIN_AUTOMATION_ACCESS_KEY_ID_PROD}}
          OTELBIN_AUTOMATION_SECRET_ACCESS_KEY_PROD: ${{secrets.OTELBIN_AUTOMATION_SECRET_ACCESS_KEY_PROD}}
          OTELBIN_AUTOMATION_ROLE_ARN_PROD: ${{secrets.OTELBIN_AUTOMATION_ROLE_ARN_PROD}}
          OTELBIN_AUTOMATION_ACCOUNT_DEV: ${{secrets.OTELBIN_AUTOMATION_ACCOUNT_DEV}}
          OTELBIN_AUTOMATION_ACCESS_KEY_ID_DEV: ${{secrets.OTELBIN_AUTOMATION_ACCESS_KEY_ID_DEV}}
          OTELBIN_AUTOMATION_SECRET_ACCESS_KEY_DEV: ${{secrets.OTELBIN_AUTOMATION_SECRET_ACCESS_KEY_DEV}}
          OTELBIN_AUTOMATION_ROLE_ARN_DEV: ${{secrets.OTELBIN_AUTOMATION_ROLE_ARN_DEV}}
        # language=bash
        run: |
          if [ "${TEST_ENVIRONMENT_NAME}" == 'main' ]; then
            echo "aws_account=${OTELBIN_AUTOMATION_ACCOUNT_PROD}" >> "${GITHUB_OUTPUT}"
            echo "aws_access_key=${OTELBIN_AUTOMATION_ACCESS_KEY_ID_PROD}" >> "${GITHUB_OUTPUT}"
            echo "aws_secret_access_key=${OTELBIN_AUTOMATION_SECRET_ACCESS_KEY_PROD}" >> "${GITHUB_OUTPUT}"
            echo "role_arn=${OTELBIN_AUTOMATION_ROLE_ARN_PROD}" >> "${GITHUB_OUTPUT}"
          else
            echo "aws_account=${OTELBIN_AUTOMATION_ACCOUNT_DEV}" >> "${GITHUB_OUTPUT}"
            echo "aws_access_key=${OTELBIN_AUTOMATION_ACCESS_KEY_ID_DEV}" >> "${GITHUB_OUTPUT}"
            echo "aws_secret_access_key=${OTELBIN_AUTOMATION_SECRET_ACCESS_KEY_DEV}" >> "${GITHUB_OUTPUT}"
            echo "role_arn=${OTELBIN_AUTOMATION_ROLE_ARN_DEV}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ steps.select_credentials.outputs.aws_access_key }}
          aws-secret-access-key: ${{ steps.select_credentials.outputs.aws_secret_access_key }}
          aws-region: 'us-east-2'
          mask-aws-account-id: true
          role-to-assume: ${{ steps.select_credentials.outputs.role_arn }}

      - name: Deploy validation backend
        shell: bash
        working-directory: packages/otelbin-validation
        env:
          AWS_DEFAULT_REGION: 'us-east-2'
          CDK_DEPLOY_ACCOUNT: ${{ steps.select_credentials.outputs.aws_account }}
          CDK_DEPLOY_REGION: 'us-east-2'
          GH_TOKEN: ${{ github.token }}
          TEST_ENVIRONMENT_NAME: ${{ steps.get_test_env_name.outputs.test_env_name }}
        # The Dash0 authorization token is no longer passed in here: the Lambda's environment
        # variable is populated by CloudFormation from Secrets Manager at deploy time (see
        # DASH0_AUTHORIZATION_TOKEN_SECRET_NAME in src/main.ts), so it never has to pass through
        # this workflow (or any GitHub secret) at all.
        run: |
          npx projen deploy --require-approval never --outputs-file ./cdk-outputs.json

      - name: Read API Gateway URL
        id: parse_cdk_output
        shell: bash
        working-directory: packages/otelbin-validation
        env:
          TEST_ENVIRONMENT_NAME: ${{ steps.get_test_env_name.outputs.test_env_name }}
        run: |
          echo api_gateway_name=$(jq -r ".[\"otelbin-validation-${TEST_ENVIRONMENT_NAME}\"] | .apiname" < ./cdk-outputs.json) >> ${GITHUB_OUTPUT}
          echo api_gateway_url=$(jq -r ".[\"otelbin-validation-${TEST_ENVIRONMENT_NAME}\"] | .apiurl" < ./cdk-outputs.json) >> ${GITHUB_OUTPUT}
          echo api_gateway_key_id=$(jq -r ".[\"otelbin-validation-${TEST_ENVIRONMENT_NAME}\"] | .apikeyid" < ./cdk-outputs.json) >> ${GITHUB_OUTPUT}

      - name: Publish validation API key to SSM
        shell: bash
        env:
          AWS_DEFAULT_REGION: 'us-east-2'
          API_GATEWAY_KEY_ID: ${{ steps.parse_cdk_output.outputs.api_gateway_key_id }}
          TEST_ENVIRONMENT_NAME: ${{ steps.get_test_env_name.outputs.test_env_name }}
        # Fetch the API key's value exactly once, here, and hand it to the ~90 parallel run-itests
        # matrix jobs via SSM Parameter Store instead of each of them independently calling
        # `apigateway get-api-key --include-value`. That's a control-plane API with a low
        # per-account throttle, and ~90 concurrent callers reliably tripped TooManyRequestsException.
        # SSM's GetParameter is built for exactly this high-fan-out read pattern.
        run: |
          API_KEY_VALUE=$(aws apigateway get-api-key --api-key "${API_GATEWAY_KEY_ID}" --include-value --query value --output text)
          echo "::add-mask::${API_KEY_VALUE}"
          aws ssm put-parameter \
            --name "/otelbin-validation/${TEST_ENVIRONMENT_NAME}/validation-api-key" \
            --type SecureString \
            --value "${API_KEY_VALUE}" \
            --overwrite

      - name: Prepare test matrix
        id: prepare_test_matrix
        shell: bash
        working-directory: packages/otelbin-validation
        run: |
          echo test_matrix=$(jq -r '. | [to_entries[] | {distribution: .key, release: .value.releases[].version} | "\(.distribution)/\(.release)"]' < ./src/assets/supported-distributions.json) >> ${GITHUB_OUTPUT}

  run-itests:
    name: Validation tests
    needs: ['prep-itests']
    # See prep-itests above for why this condition exists; run-itests needs the same gating
    # since it depends on prep-itests's outputs and shares the same credential requirements.
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]')
    strategy:
      matrix:
        test_matrix: ${{ fromJson(needs.prep-itests.outputs.test_matrix )}}
      fail-fast: false # We want to run all the tests, to prevent one failure from hiding another
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # See prep-itests above: check out the PR's own head commit, not the base branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install CDK dependencies
        shell: bash
        working-directory: packages/otelbin-validation
        # See prep-itests above for why --ignore-scripts is used here.
        run: |
          npm ci --ignore-scripts

      - name: Select credentials
        id: select_credentials
        shell: bash
        env:
          TEST_ENVIRONMENT_NAME: ${{ needs.prep-itests.outputs.test_env_name }}
          OTELBIN_AUTOMATION_ACCESS_KEY_ID_PROD: ${{secrets.OTELBIN_AUTOMATION_ACCESS_KEY_ID_PROD}}
          OTELBIN_AUTOMATION_SECRET_ACCESS_KEY_PROD: ${{secrets.OTELBIN_AUTOMATION_SECRET_ACCESS_KEY_PROD}}
          OTELBIN_AUTOMATION_ROLE_ARN_PROD: ${{secrets.OTELBIN_AUTOMATION_ROLE_ARN_PROD}}
          OTELBIN_AUTOMATION_ACCESS_KEY_ID_DEV: ${{secrets.OTELBIN_AUTOMATION_ACCESS_KEY_ID_DEV}}
          OTELBIN_AUTOMATION_SECRET_ACCESS_KEY_DEV: ${{secrets.OTELBIN_AUTOMATION_SECRET_ACCESS_KEY_DEV}}
          OTELBIN_AUTOMATION_ROLE_ARN_DEV: ${{secrets.OTELBIN_AUTOMATION_ROLE_ARN_DEV}}
        # language=bash
        run: |
          if [ "${TEST_ENVIRONMENT_NAME}" == 'main' ]; then
            echo "aws_access_key=${OTELBIN_AUTOMATION_ACCESS_KEY_ID_PROD}" >> "${GITHUB_OUTPUT}"
            echo "aws_secret_access_key=${OTELBIN_AUTOMATION_SECRET_ACCESS_KEY_PROD}" >> "${GITHUB_OUTPUT}"
            echo "role_arn=${OTELBIN_AUTOMATION_ROLE_ARN_PROD}" >> "${GITHUB_OUTPUT}"
          else
            echo "aws_access_key=${OTELBIN_AUTOMATION_ACCESS_KEY_ID_DEV}" >> "${GITHUB_OUTPUT}"
            echo "aws_secret_access_key=${OTELBIN_AUTOMATION_SECRET_ACCESS_KEY_DEV}" >> "${GITHUB_OUTPUT}"
            echo "role_arn=${OTELBIN_AUTOMATION_ROLE_ARN_DEV}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ steps.select_credentials.outputs.aws_access_key }}
          aws-secret-access-key: ${{ steps.select_credentials.outputs.aws_secret_access_key }}
          aws-region: 'us-east-2'
          mask-aws-account-id: true
          role-to-assume: ${{ steps.select_credentials.outputs.role_arn }}

      - name: Retrieve API Key for Validation API and run tests
        shell: bash
        working-directory: packages/otelbin-validation
        env:
          AWS_DEFAULT_REGION: 'us-east-2'
          API_GATEWAY_NAME: ${{ needs.prep-itests.outputs.validation_api_apigateway_name }}
          API_GATEWAY_URL: ${{ needs.prep-itests.outputs.validation_api_apigateway_url }}
          TEST_ENVIRONMENT_NAME: ${{ needs.prep-itests.outputs.test_env_name }}
          RELEASE_UNDER_TEST: ${{ matrix.test_matrix }}
        # language=bash
        run: |
          # Read the API key from SSM (published once by prep-itests) instead of calling
          # apigateway get-api-key directly - see the "Publish validation API key to SSM" step.
          # A short retry still absorbs any transient throttling from ~90 jobs reading at once.
          for attempt in 1 2 3 4 5; do
            if VALIDATION_API_KEY=$(aws ssm get-parameter \
              --name "/otelbin-validation/${TEST_ENVIRONMENT_NAME}/validation-api-key" \
              --with-decryption --query Parameter.Value --output text); then
              break
            fi
            echo "Attempt ${attempt} to read the validation API key from SSM failed; retrying."
            sleep $((attempt * 2))
          done

          if [ -z "${VALIDATION_API_KEY:-}" ]; then
            echo "Failed to retrieve the validation API key from SSM after 5 attempts." >&2
            exit 1
          fi

          echo "::add-mask::${VALIDATION_API_KEY}"
          VALIDATION_API_KEY="${VALIDATION_API_KEY}" npm run test
